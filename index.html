<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vitamin D Tracker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0A1633;
    color: #F1F5F9;
    min-height: 100vh;
    padding: 24px 16px;
  }

  h1 {
    font-size: 18px;
    font-weight: 800;
    text-align: center;
    margin-bottom: 4px;
  }

  .sub {
    text-align: center;
    font-size: 11px;
    color: #64748B;
    margin-bottom: 24px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* SHELF */
  .shelf {
    max-width: 420px;
    margin: 0 auto 24px;
    background: #111A2C;
    border-radius: 10px;
    border: 2px solid #C8933A;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }

  .wood-top {
    height: 8px;
    background: linear-gradient(180deg, #E8C47A, #C8933A);
    border-bottom: 1px solid #5a4020;
  }

  .wood-bottom {
    height: 12px;
    background: linear-gradient(180deg, #C8933A, #8B5E1A);
    border-top: 1px solid rgba(255,255,255,0.3);
  }

  .shelf-label {
    padding: 6px 12px;
    background: rgba(255,255,255,0.05);
    border-bottom: 1px dashed #C8933A;
    font-size: 10px;
    font-weight: 800;
    color: #E8C47A;
    letter-spacing: 1px;
  }

  .shelf-face {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    min-height: 130px;
    padding: 12px;
    gap: 16px;
    background: linear-gradient(180deg, rgba(255,255,255,0.05), transparent);
  }

  /* PRODUCT SLOT */
  .slot {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    width: 80px;
    transition: transform 0.15s;
    user-select: none;
  }

  .slot:active { transform: scale(0.95); }

  .bottle {
    width: 56px;
    height: 84px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    transition: all 0.25s ease;
    position: relative;
    background: rgba(255,255,255,0.9);
  }

  /* STATE: AVAILABLE */
  .slot.available .bottle {
    border: 3px solid #22C55E;
    box-shadow: 0 0 18px rgba(34, 197, 94, 0.6);
    background: rgba(34, 197, 94, 0.08);
  }

  /* STATE: UNAVAILABLE */
  .slot.unavailable .bottle {
    border: 3px solid #EF4444;
    box-shadow: 0 0 18px rgba(239, 68, 68, 0.6);
    background: rgba(239, 68, 68, 0.08);
  }

  /* STATE: EMPTY (black dotted) */
  .slot.empty .bottle {
    border: 3px dotted #000;
    background: rgba(255,255,255,0.05);
    box-shadow: none;
    opacity: 0.4;
  }

  /* ORDER TICK */
  .tick {
    position: absolute;
    top: -8px;
    right: -8px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #1E3A8A;
    border: 2px solid #4BA3E3;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 900;
    color: transparent;
    transition: all 0.2s;
  }

  .slot.ticked .tick {
    background: #4BA3E3;
    color: #fff;
  }

  .ground-shadow {
    width: 46px;
    height: 5px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.5) 0%, transparent 70%);
    margin-top: -2px;
    border-radius: 50%;
  }

  .label {
    font-size: 9px;
    font-weight: 800;
    text-align: center;
    margin-top: 6px;
    color: #F1F5F9;
    max-width: 80px;
    line-height: 1.2;
  }

  .state-text {
    font-size: 8px;
    font-weight: 900;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 3px;
  }

  .slot.available .state-text { color: #22C55E; }
  .slot.unavailable .state-text { color: #EF4444; }
  .slot.empty .state-text { color: #64748B; }

  /* ORDER LIST */
  .order-panel {
    max-width: 420px;
    margin: 0 auto;
    background: #0D1E40;
    border: 1px solid #1E3A8A;
    border-radius: 12px;
    padding: 16px;
  }

  .order-title {
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #94A3B8;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
  }

  .order-count {
    background: #4BA3E3;
    color: #fff;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 10px;
  }

  .order-list {
    list-style: none;
    font-size: 12px;
    color: #F1F5F9;
  }

  .order-list li {
    padding: 8px 0;
    border-bottom: 1px solid #1E3A8A;
    display: flex;
    justify-content: space-between;
    font-family: 'SF Mono', monospace;
  }

  .order-list li:last-child { border-bottom: none; }

  .order-empty {
    font-size: 11px;
    color: #64748B;
    text-align: center;
    padding: 12px 0;
    font-style: italic;
  }

  /* HINT */
  .hint {
    text-align: center;
    font-size: 10px;
    color: #64748B;
    margin-top: 16px;
    line-height: 1.6;
  }
</style>
</head>
<body>

  <h1>💊 Vitamin D Tracker</h1>
  <div class="sub">Rack 1 · Shelf 1</div>

  <!-- SHELF -->
  <div class="shelf">
    <div class="wood-top"></div>
    <div class="shelf-label">SHELF 1.1</div>
    <div class="shelf-face">
      <div class="slot available" id="slot" onclick="cycleState()">
        <div class="bottle">
          💊
          <div class="tick" onclick="toggleTick(event)">✓</div>
        </div>
        <div class="ground-shadow"></div>
        <div class="label">Vitamin D3 1000 IU</div>
        <div class="state-text" id="stateText">Available</div>
      </div>
    </div>
    <div class="wood-bottom"></div>
  </div>

  <!-- ORDER LIST -->
  <div class="order-panel">
    <div class="order-title">
      <span>📋 Order List</span>
      <span class="order-count" id="orderCount">0</span>
    </div>
    <ul class="order-list" id="orderList">
      <li class="order-empty">No items ticked yet</li>
    </ul>
  </div>

  <div class="hint">
    Tap the bottle → cycle Available / Unavailable / Empty<br>
    Tap the ✓ badge → add to order list
  </div>

<script>
  // STATES
  const STATES = ['available', 'unavailable', 'empty'];
  const LABELS = { available: 'Available', unavailable: 'Unavailable', empty: 'Empty' };

  let currentState = 0;
  let ticked = false;

  const slot = document.getElementById('slot');
  const stateText = document.getElementById('stateText');
  const orderList = document.getElementById('orderList');
  const orderCount = document.getElementById('orderCount');

  // PRODUCT DATA
  const product = {
    name: 'Vitamin D3 1000 IU',
    barcode: '5012345678900'
  };

  // CYCLE STATE (tap the bottle)
  function cycleState() {
    // Remove all state classes
    STATES.forEach(s => slot.classList.remove(s));
    // Move to next state
    currentState = (currentState + 1) % STATES.length;
    const newState = STATES[currentState];
    slot.classList.add(newState);
    stateText.textContent = LABELS[newState];
  }

  // TOGGLE TICK (tap the ✓)
  function toggleTick(e) {
    e.stopPropagation(); // don't trigger the state cycle
    ticked = !ticked;
    slot.classList.toggle('ticked', ticked);
    renderOrderList();
  }

  // RENDER ORDER LIST
  function renderOrderList() {
    if (ticked) {
      orderList.innerHTML = `
        <li>
          <span>${product.name}</span>
          <span style="color:#4BA3E3;">×1</span>
        </li>
      `;
      orderCount.textContent = '1';
    } else {
      orderList.innerHTML = `<li class="order-empty">No items ticked yet</li>`;
      orderCount.textContent = '0';
    }
  }

  renderOrderList();
</script>

</body>
</html>
