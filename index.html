<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>PharmaTrack Pro — iOS Glass Edition</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      /* iOS Dark Mode Color Palette */
      --bg: #000000;
      --panel: rgba(28, 28, 30, 0.45);
      --panel2: rgba(44, 44, 46, 0.5);
      --text: #ffffff;
      --text-sec: rgba(235, 235, 245, 0.6); /* iOS Secondary Label */
      --accent: #0a84ff; /* iOS Blue */
      --purple: #bf5af2;
      --green: #30d158;
      --amber: #ff9f0a;
      --red: #ff453a;
      --cyan: #64d2ff;
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-bg: rgba(255, 255, 255, 0.06);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      --r: 22px; /* iOS Widget Radius */
      --r2: 14px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      /* Native Apple Typography */
      font: 14px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient Background Orbs for Glass Effect */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
    }
    body::before {
      top: -10%; left: -10%;
      width: 50vw; height: 50vw;
      background: radial-gradient(circle, rgba(10, 132, 255, 0.15), transparent 70%);
    }
    body::after {
      bottom: -10%; right: -10%;
      width: 60vw; height: 60vw;
      background: radial-gradient(circle, rgba(191, 90, 242, 0.12), transparent 70%);
    }

    button, input, select, textarea { font: inherit; outline: none; }
    button { cursor: pointer; }

    /* Layout Structure */
    .app { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; position: relative; z-index: 1; }
    
    /* Desktop Sidebar */
    .sidebar {
      position: sticky; top: 0; height: 100vh; padding: 24px 16px;
      border-right: 0.5px solid var(--glass-border); 
      background: rgba(20, 20, 22, 0.6);
      backdrop-filter: blur(30px) saturate(150%); -webkit-backdrop-filter: blur(30px) saturate(150%);
      display: flex; flex-direction: column; z-index: 20;
    }
    .brand { display: flex; align-items: center; gap: 12px; padding: 0 8px 30px; }
    .mark {
      width: 42px; height: 42px; border-radius: 12px;
      background: linear-gradient(135deg, #0a84ff, #bf5af2);
      display: grid; place-items: center; font-weight: 800; font-size: 20px;
      box-shadow: 0 4px 14px rgba(10, 132, 255, 0.4);
    }
    .brand b { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
    
    .nav { display: grid; gap: 4px; }
    .nav button {
      border: none; background: transparent; color: var(--text-sec);
      padding: 12px 14px; border-radius: 14px; text-align: left; display: flex;
      gap: 12px; align-items: center; transition: all 0.2s; font-weight: 500;
    }
    .nav button:hover { background: var(--glass-bg); color: var(--text); }
    .nav button.active {
      background: rgba(10, 132, 255, 0.15);
      color: var(--accent); font-weight: 600;
    }
    .nav .ico { font-size: 18px; width: 22px; text-align: center; }
    .sidebar-foot { margin-top: auto; }
    .status-card { padding: 12px; border-radius: 14px; border: 0.5px solid var(--glass-border); background: var(--glass-bg); color: var(--text-sec); font-size: 12px; }

    /* Top Bar */
    .main { min-width: 0; display: flex; flex-direction: column; }
    .topbar {
      position: sticky; top: 0; z-index: 15; height: 64px; padding: 0 26px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 0.5px solid var(--glass-border); 
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(30px) saturate(150%); -webkit-backdrop-filter: blur(30px) saturate(150%);
    }
    .crumb { color: var(--text-sec); font-size: 15px; font-weight: 500; letter-spacing: -0.3px; }
    .crumb b { color: var(--text); font-weight: 600; }
    .top-actions { display: flex; gap: 8px; }

    /* Content Area */
    .content { padding: 24px 28px 40px; max-width: 1560px; margin: 0 auto; width: 100%; }
    .page { display: none; animation: pageFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .page.active { display: block; }
    @keyframes pageFade { from { opacity: 0; transform: translateY(10px) scale(0.99); } to { opacity: 1; transform: translateY(0) scale(1); } }

    /* Page Head */
    .page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
    .page-head h1 { font-size: 32px; font-weight: 700; margin: 0 0 4px; letter-spacing: -0.8px; }
    .page-head p { margin: 0; color: var(--text-sec); font-size: 15px; }

    /* Buttons */
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn {
      min-height: 38px; padding: 0 16px; border-radius: 12px; border: 0.5px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.08); color: var(--text); font-weight: 600; font-size: 14px;
      transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.12); }
    .btn:active { transform: scale(0.97); }
    .btn.primary {
      border: none; background: var(--accent); color: #fff;
    }
    .btn.primary:hover { background: #0071e3; }
    .btn.green { background: rgba(48, 209, 88, 0.15); border-color: transparent; color: var(--green); }
    .btn.warn { background: rgba(255, 159, 10, 0.15); border-color: transparent; color: var(--amber); }
    .btn.danger { background: rgba(255, 69, 58, 0.15); border-color: transparent; color: var(--red); }

    /* Hero Banner */
    .hero {
      padding: 30px; border-radius: 24px; margin-bottom: 20px;
      background: linear-gradient(135deg, rgba(10, 132, 255, 0.15), rgba(191, 90, 242, 0.1));
      border: 0.5px solid rgba(10, 132, 255, 0.2);
      position: relative; overflow: hidden;
    }
    .hero h2 { font-size: 28px; margin: 0 0 6px; font-weight: 700; letter-spacing: -0.5px; }
    .hero p { margin: 0; color: var(--text-sec); font-size: 15px; }

    /* Editable Inline Spans */
    .editable-val {
      border-bottom: 1px dashed var(--text-sec); padding-bottom: 1px; cursor: text; transition: all 0.2s;
    }
    .editable-val:focus { background: rgba(255,255,255,0.1); border-bottom: 1px solid var(--text); border-radius: 4px; padding: 0 4px; }

    /* Cards and Grids - iOS Widget Style */
    .grid { display: grid; gap: 16px; }
    .kpis { grid-template-columns: repeat(6, minmax(0, 1fr)); margin-bottom: 16px; }
    .card {
      background: var(--panel); border: 0.5px solid var(--glass-border);
      border-radius: var(--r); box-shadow: var(--shadow);
      backdrop-filter: blur(40px) saturate(200%); -webkit-backdrop-filter: blur(40px) saturate(200%);
    }
    .kpi { padding: 18px; }
    .kpi .label { color: var(--text-sec); font-size: 12px; font-weight: 500; margin-bottom: 6px; }
    .kpi .val { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
    .kpi .sub { font-size: 12px; color: var(--green); margin-top: 4px; font-weight: 500; }

    .layout2 { grid-template-columns: 1.4fr 0.9fr; }
    .layout3 { grid-template-columns: repeat(3, 1fr); }
    .panel { padding: 20px; }
    .panel-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .panel-title h3 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -0.3px; }

    /* Tables */
    .table-wrap { overflow-x: auto; border-radius: var(--r2); background: transparent; }
    .table { width: 100%; border-collapse: collapse; min-width: 760px; font-size: 14px; }
    .table th, .table td { padding: 12px 14px; border-bottom: 0.5px solid var(--glass-border); text-align: left; }
    .table th { font-size: 12px; color: var(--text-sec); font-weight: 500; background: rgba(255, 255, 255, 0.02); }
    .table tr:last-child td { border-bottom: 0; }
    .table input {
      width: 100%; min-width: 60px; padding: 8px 10px; background: rgba(0, 0, 0, 0.2);
      border: 0.5px solid var(--glass-border); border-radius: 8px; color: var(--text); font-size: 14px;
    }
    .table input:focus { border-color: var(--accent); }

    /* Chart & Progress */
    .chart { height: 140px; display: flex; align-items: flex-end; gap: 8px; padding-top: 10px; }
    .bar {
      flex: 1; border-radius: 6px 6px 3px 3px;
      background: var(--accent); opacity: 0.85;
      position: relative; transition: height 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .bar small { position: absolute; left: 50%; transform: translateX(-50%); bottom: -24px; color: var(--text-sec); font-size: 11px; }
    .chart-wrap { padding-bottom: 24px; }
    .progress { height: 8px; background: rgba(255, 255, 255, 0.1); border-radius: 99px; overflow: hidden; margin: 10px 0; }
    .progress > span { display: block; height: 100%; border-radius: inherit; background: var(--accent); transition: width 0.5s; }

    /* Badges */
    .badge { display: inline-flex; align-items: center; gap: 4px; border-radius: 6px; padding: 4px 8px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .badge.ok { color: var(--green); background: rgba(48, 209, 88, 0.15); }
    .badge.warn { color: var(--amber); background: rgba(255, 159, 10, 0.15); }
    .badge.red { color: var(--red); background: rgba(255, 69, 58, 0.15); }

    /* Modals & Toast */
    .modal { position: fixed; inset: 0; display: none; place-items: center; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); z-index: 90; padding: 16px; }
    .modal.open { display: grid; }
    .modal-card { width: min(640px, 100%); max-height: 90vh; overflow-y: auto; padding: 24px; border-radius: 24px; background: rgba(28,28,30,0.85); backdrop-filter: blur(40px); border: 0.5px solid var(--glass-border); box-shadow: var(--shadow); }
    .toast { position: fixed; right: 20px; bottom: 20px; z-index: 100; background: rgba(28,28,30,0.9); backdrop-filter: blur(20px); border: 0.5px solid var(--glass-border); padding: 14px 20px; border-radius: 14px; display: none; font-size: 14px; font-weight: 500; box-shadow: var(--shadow); }
    .toast.show { display: block; animation: pageFade 0.3s ease; }

    /* Mobile Floating Pill Dock (iOS Style) */
    @media(max-width: 900px) {
      .app { grid-template-columns: 1fr; padding-bottom: 100px; }
      
      .sidebar {
        position: fixed; top: auto; bottom: 20px; left: 20px; right: 20px; height: 72px;
        flex-direction: row; justify-content: space-around; padding: 0 10px;
        border-radius: 36px; border: 0.5px solid rgba(255, 255, 255, 0.15); 
        background: rgba(30, 30, 32, 0.65);
        backdrop-filter: blur(40px) saturate(200%); -webkit-backdrop-filter: blur(40px) saturate(200%);
        box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      }
      .brand, .sidebar-foot { display: none !important; }
      .nav { display: flex; width: 100%; justify-content: space-around; gap: 0; align-items: center; }
      
      .nav button { 
        flex-direction: column; padding: 8px; border-radius: 16px; font-size: 10px; 
        gap: 4px; justify-content: center; width: 64px; text-align: center;
      }
      .nav button .ico { font-size: 22px; width: 100%; }
      .nav button.active { background: transparent; color: var(--accent); }
      
      .kpis { grid-template-columns: repeat(2, 1fr); }
      .layout2, .layout3 { grid-template-columns: 1fr; }
      .content { padding: 16px; }
      .page-head h1 { font-size: 28px; }
    }
  </style>
</head>
<body>

<div class="app">
  <!-- Interactive Navigation -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="mark">P</div>
      <div>
        <b>PharmaTrack</b>
        <small style="display:block;color:var(--text-sec);font-size:12px">iOS Glass v3.0</small>
      </div>
    </div>
    <nav class="nav" id="nav">
      <button class="active" data-page="dashboard"><span class="ico">􀉉</span>Dashboard</button>
      <button data-page="sales"><span class="ico">􀏧</span>Sales</button>
      <button data-page="inventory"><span class="ico">􀐚</span>Inventory</button>
      <button data-page="scanner"><span class="ico">􀎰</span>Scanner</button>
      <button data-page="expiry"><span class="ico">􀐫</span>Expiry</button>
      <button data-page="settings"><span class="ico">􀍟</span>Settings</button>
    </nav>
  </aside>

  <!-- Main Content Areas -->
  <main class="main">
    <header class="topbar">
      <div class="crumb">PharmaTrack / <b id="crumb">Dashboard</b></div>
      <div class="top-actions">
        <button class="btn primary" id="quickAdd">＋ Add</button>
      </div>
    </header>

    <div class="content">
      <!-- 1. DASHBOARD -->
      <section class="page active" id="page-dashboard">
        <div class="hero">
          <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap">
            <div>
              <div class="badge ok" style="margin-bottom:8px">Live Sync Active</div>
              <h2>Welcome, <span class="editable-val" id="userName" contenteditable="true">Vysakh</span></h2>
              <p>Branch: <span class="editable-val" id="branchNameDash" contenteditable="true">Boots DXB T3</span></p>
            </div>
          </div>
        </div>

        <div class="grid kpis" id="dashKpis"></div>

        <div class="grid layout2">
          <div class="card panel">
            <div class="panel-title">
              <h3>Target Progress</h3>
              <span>Target: <b class="editable-val" id="achSub" contenteditable="true">60000</b></span>
            </div>
            <div style="font-size:40px;font-weight:700;letter-spacing:-1px;" id="achVal">0%</div>
            <div class="progress"><span id="achBar" style="width:0%"></span></div>
            <div style="font-size:13px;color:var(--text-sec);margin-top:8px;" id="paceText"></div>
            
            <div class="chart-wrap" style="margin-top:24px">
              <div class="panel-title"><h3>Hourly Revenue</h3></div>
              <div class="chart" id="salesChart"></div>
            </div>
          </div>

          <div class="card panel">
            <div class="panel-title"><h3>Expiry Alerts</h3><span id="watchCount" class="badge red"></span></div>
            <div id="watchList" style="display:grid;gap:8px"></div>
          </div>
        </div>
      </section>

      <!-- Structure for other pages kept exact, classes updated to match glassmorphism -->
      <section class="page" id="page-sales">
        <div class="page-head">
          <div><h1>Sales Entry</h1><p>Hourly tracking and pacing.</p></div>
          <button class="btn primary" id="saveSales">Save Checkpoint</button>
        </div>
        <div class="card panel"><div class="table-wrap"><table class="table" id="salesTable"></table></div></div>
      </section>

      <section class="page" id="page-inventory">
        <div class="page-head"><div><h1>Inventory</h1></div></div>
        <div class="card panel"><div class="table-wrap"><table class="table" id="invTable"></table></div></div>
      </section>

      <section class="page" id="page-scanner">
         <div class="page-head"><div><h1>Scanner</h1></div></div>
         <div class="card panel" style="text-align:center; padding: 60px;">
           <h3>Scanner Module Ready</h3>
           <textarea id="gs1Input" class="table input" placeholder="(01)...(17)..." style="width: 100%; max-width:400px; margin: 20px auto; display:block;"></textarea>
           <button class="btn primary" id="parseGs1">Simulate Scan</button>
         </div>
      </section>

      <section class="page" id="page-expiry"><div class="page-head"><h1>Expiry Tracker</h1></div><div class="card panel"><div class="table-wrap"><table class="table" id="expiryTable"></table></div></div></section>
      <section class="page" id="page-settings"><div class="page-head"><h1>Settings</h1></div><div class="card panel"><button class="btn danger" id="resetDemo">Reset Data</button></div></section>

    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
// Logic preserved from the functional version
const KEY = 'pharmatrack_ios_v3';
const hours = ['12am','2am','4am','6am','8am','10am','12pm','2pm','4pm','6pm'];
const metricCols = ['sales','trn','no7','aura','units','footfall'];

function defaultState() {
  return { version: 3, settings: { branch: 'Boots DXB T3 Arrivals', target: 60000, userName: 'Vysakh' }, products: [{ id: 1, gtin: '874312020605', rms: 'ZIBOZ1202', description: 'ZINCELATED 50MG', expiry: new Date(Date.now() + 86400000*22).toISOString().slice(0,10), units: 4, min: 6, max: 24, shelf: 'RACK 1' }], sales: { rows: hours.map((h, i) => ({ hour: h, sales: [1200, 950, 1400, 800, 1600, 2100, 1950, 1700, 1300, 900][i], trn: 10, no7: 40, aura: 6, units: 24, footfall: 40 })) }, scans: [] };
}

let state = JSON.parse(localStorage.getItem(KEY)) || defaultState();
function persist() { localStorage.setItem(KEY, JSON.stringify(state)); }

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

// Navigation System
document.getElementById('nav').addEventListener('click', e => {
  const b = e.target.closest('button[data-page]');
  if (b) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('#nav button').forEach(n => n.classList.remove('active'));
    document.getElementById('page-' + b.dataset.page).classList.add('active');
    b.classList.add('active');
    document.getElementById('crumb').textContent = b.dataset.page.charAt(0).toUpperCase() + b.dataset.page.slice(1);
    window.scrollTo(0, 0);
  }
});

// Editable Listeners
document.getElementById('userName').onblur = e => { state.settings.userName = e.target.textContent.trim(); persist(); };
document.getElementById('branchNameDash').onblur = e => { state.settings.branch = e.target.textContent.trim(); persist(); };
document.getElementById('achSub').onblur = e => {
  const v = Number(e.target.textContent.replace(/[^0-9.]/g, ''));
  if (v > 0) { state.settings.target = v; renderDashboard(); persist(); }
};

function renderDashboard() {
  document.getElementById('userName').textContent = state.settings.userName || 'Vysakh';
  document.getElementById('branchNameDash').textContent = state.settings.branch;
  document.getElementById('achSub').textContent = state.settings.target;
  
  const totalSales = state.sales.rows.reduce((sum, r) => sum + Number(r.sales), 0);
  const tgt = state.settings.target;
  const pct = Math.min(100, (totalSales / tgt) * 100);
  
  document.getElementById('achVal').textContent = pct.toFixed(1) + '%';
  document.getElementById('achBar').style.width = pct + '%';
  document.getElementById('paceText').textContent = `AED ${totalSales.toLocaleString()} reached · AED ${Math.max(0, tgt - totalSales).toLocaleString()} remaining`;

  document.getElementById('dashKpis').innerHTML = [
    ['Total Sales', `AED ${totalSales.toLocaleString()}`],
    ['Transactions', state.sales.rows.reduce((s,r)=>s+r.trn,0)],
    ['Items Sold', state.sales.rows.reduce((s,r)=>s+r.units,0)]
  ].map(x => `<div class="card kpi"><div class="label">${x[0]}</div><div class="val">${x[1]}</div></div>`).join('');

  const mx = Math.max(...state.sales.rows.map(r => r.sales), 1);
  document.getElementById('salesChart').innerHTML = state.sales.rows.map(r => `<div class="bar" style="height:${Math.max(12, (r.sales/mx)*100)}%"><small>${r.hour}</small></div>`).join('');
}

renderDashboard();
</script>
</body>
</html>
